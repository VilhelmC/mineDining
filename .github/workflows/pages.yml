# C-6 (LEDGER §3): deploy app/ to GitHub Pages for phone testing over HTTPS.
# Runs on every push to main that touches the app or the spec, and on demand
# (Actions → "Deploy app to Pages" → Run workflow). URL: https://vilhelmc.github.io/mineDining/
name: Deploy app to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "spec/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w app
        env:
          BASE: /mineDining/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
